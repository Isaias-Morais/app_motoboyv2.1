<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Entrar | APP MOTOBOY</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page"><main class="card auth-card"><a class="auth-logo" href="login.html" aria-label="APP MOTOBOY"><img src="img/logo-icon.png" alt="APP MOTOBOY"></a><p class="eyebrow">BEM-VINDO DE VOLTA</p><h1 class="auth-title">Entre na sua conta</h1><p class="auth-subtitle">Acompanhe seus ganhos, gastos e a sua moto em um só lugar.</p><form class="formulario" id="form-login"><div class="campo"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="campo"><label for="senha">Senha</label><input id="senha" name="senha" type="password" autocomplete="current-password" required></div><button class="button" id="btn-login" type="submit">ENTRAR</button></form><p class="status" id="mensagem-login" role="status" aria-live="polite"></p><p class="auth-footer">Ainda não tem uma conta? <a href="cadastro.html">Crie seu cadastro</a></p></main><script src="js/app.js"></script><script>
(() => {
  const { baseUrl, mensagemErro } = window.MotoboyApi;
  const form = document.getElementById("form-login"), botao = document.getElementById("btn-login"), mensagem = document.getElementById("mensagem-login");
  form.addEventListener("submit", async evento => {
    evento.preventDefault(); botao.disabled = true; botao.textContent = "ENTRANDO..."; mensagem.textContent = ""; mensagem.classList.remove("status--erro");
    try {
      const dados = new URLSearchParams({ username:document.getElementById("email").value.trim(), password:document.getElementById("senha").value, grant_type:"password" });
      const resposta = await fetch(baseUrl + "/Motoboy/auth", { method:"POST", headers:{ Accept:"application/json", "Content-Type":"application/x-www-form-urlencoded" }, body:dados });
      const resultado = await resposta.json().catch(() => ({}));
      if (!resposta.ok || !resultado.access_token) throw new Error(typeof resultado.detail === "string" ? resultado.detail : "Não foi possível entrar.");
      localStorage.setItem("access_token", resultado.access_token); window.location.assign("index.html");
    } catch (erro) { mensagem.textContent = mensagemErro(erro); mensagem.classList.add("status--erro"); botao.disabled = false; botao.textContent = "ENTRAR"; }
  });
})();
</script></body></html>
