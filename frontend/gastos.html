<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#0b0b0b"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="img/pwa-icon.svg"><title>Gastos | APP MOTOBOY</title><link rel="stylesheet" href="css/style.css"></head>
<body><aside class="sidebar"><a class="logo" href="index.html" aria-label="APP MOTOBOY - início"><img src="img/logo-icon.png" alt="APP MOTOBOY"></a><nav class="menu" aria-label="Navegação principal"><a href="index.html">INÍCIO</a><a href="registrar.html">REGISTRAR</a><a href="gastos.html" aria-current="page">GASTOS</a><a href="relatorio.html">RELATÓRIO</a><a href="minha-moto.html">MINHA MOTO</a></nav><div class="perfil"><span class="avatar" aria-hidden="true">IM</span><div class="perfil-info"><strong>Perfil</strong><small>Plano atual</small></div></div></aside>
<main><header class="page-header"><div><p class="eyebrow">FINANCEIRO</p><h1>Gastos</h1></div><div class="alerta-oleo">🛢️ <span>Troca de óleo em breve</span></div></header>
<section class="tela-gastos"><article class="card"><h2>Registrar gasto</h2><p>Registre abastecimentos ou manutenções para manter o cálculo de custo por km correto.</p><form class="formulario" id="form-gasto"><div class="campo"><label for="tipo">Tipo de gasto</label><select id="tipo" name="tipo" required><option value="abastecimento">Abastecimento</option><option value="manutencao">Manutenção</option></select></div><div class="campo"><label for="valor">Valor</label><input id="valor" name="valor" type="number" min="0.01" step="0.01" placeholder="R$ 0,00" required></div><div class="campo"><label for="data">Data</label><input id="data" name="data" type="date" required></div><div class="campo"><label for="quilometragem">Quilometragem atual</label><input id="quilometragem" name="quilometragem" type="number" min="0" step="1" placeholder="0 km" required></div><div class="campo" id="campo-posto"><label for="posto">Posto</label><input id="posto" name="posto" type="text" placeholder="Ex.: Posto Avenida"></div><div class="campo" id="campo-litros"><label for="litros">Litros abastecidos</label><input id="litros" name="litros" type="number" min="0.01" step="0.01" placeholder="0 L"></div><label class="campo campo-checkbox" id="campo-tanque"><input id="tanque-completo" name="tanque-completo" type="checkbox"> Tanque completo</label><div class="campo campo--oculto" id="campo-descricao"><label for="descricao">Descrição</label><input id="descricao" name="descricao" type="text" placeholder="Ex.: troca de óleo"></div><button class="button" type="submit" id="btn-gasto">REGISTRAR GASTO</button></form><p class="status" id="mensagem-gasto" role="status" aria-live="polite"></p></article>
<section class="card"><h2>Gastos recentes</h2><div class="lista" id="lista-gastos"><p class="status">Carregando gastos...</p></div></section></section></main><script src="js/app.js"></script><script>
(() => {
  const { requisicao, mensagemErro, moeda } = window.MotoboyApi;
  const form = document.getElementById("form-gasto"), tipo = document.getElementById("tipo"), mensagem = document.getElementById("mensagem-gasto"), botao = document.getElementById("btn-gasto"), lista = document.getElementById("lista-gastos");
  const campos = { posto:document.getElementById("campo-posto"), litros:document.getElementById("campo-litros"), tanque:document.getElementById("campo-tanque"), descricao:document.getElementById("campo-descricao") };
  const formatarData = valor => valor ? new Intl.DateTimeFormat("pt-BR").format(new Date(valor + "T00:00:00")) : "";
  function atualizarTipo() {
    const abastecimento = tipo.value === "abastecimento";
    campos.posto.classList.toggle("campo--oculto", !abastecimento); campos.litros.classList.toggle("campo--oculto", !abastecimento); campos.tanque.classList.toggle("campo--oculto", !abastecimento); campos.descricao.classList.toggle("campo--oculto", abastecimento);
    document.getElementById("posto").required = abastecimento; document.getElementById("litros").required = abastecimento; document.getElementById("descricao").required = !abastecimento;
  }
  function renderizarGastos(abastecimentos, manutencoes) {
    const gastos = [...abastecimentos.map(item => ({ titulo:"Abastecimento", data:item.data_abastecimento, valor:item.valor })), ...manutencoes.map(item => ({ titulo:item.tipo || "Manutenção", data:item.data_manutencao, valor:item.valor }))].sort((a,b) => String(b.data).localeCompare(String(a.data))).slice(0, 6);
    lista.innerHTML = gastos.length ? gastos.map(item => '<article class="lista-item"><div><strong>' + item.titulo + '</strong><small>' + formatarData(item.data) + '</small></div><strong class="valor">' + moeda(item.valor) + '</strong></article>').join("") : '<p class="status">Nenhum gasto registrado.</p>';
  }
  async function carregarGastos() {
    const resultados = await Promise.allSettled([requisicao("/abastecimento/list"), requisicao("/manutencao/list")]);
    renderizarGastos(resultados[0].status === "fulfilled" ? resultados[0].value : [], resultados[1].status === "fulfilled" ? resultados[1].value : []);
  }
  tipo.addEventListener("change", atualizarTipo); atualizarTipo(); document.getElementById("data").value = new Date().toISOString().slice(0, 10);
  form.addEventListener("submit", async evento => {
    evento.preventDefault(); const abastecimento = tipo.value === "abastecimento";
    const valor = Number(document.getElementById("valor").value), quilometragem = Number(document.getElementById("quilometragem").value);
    botao.disabled = true; botao.textContent = "SALVANDO..."; mensagem.textContent = ""; mensagem.classList.remove("status--erro");
    try {
      const corpo = abastecimento ? { data:document.getElementById("data").value, posto:document.getElementById("posto").value, litros:Number(document.getElementById("litros").value), valor, tanque_completo:document.getElementById("tanque-completo").checked, quilometragem_abastecimento:quilometragem } : { data_manutencao:document.getElementById("data").value, tipo:"Manutenção", descricao:document.getElementById("descricao").value, valor, quilometragem_manutencao:quilometragem };
      await requisicao(abastecimento ? "/abastecimento/create" : "/manutencao/create", { method:"POST", body:JSON.stringify(corpo) });
      mensagem.textContent = "Gasto registrado com sucesso."; form.reset(); tipo.value = abastecimento ? "abastecimento" : "manutencao"; document.getElementById("data").value = new Date().toISOString().slice(0, 10); atualizarTipo(); await carregarGastos();
    } catch (erro) { mensagem.textContent = mensagemErro(erro); mensagem.classList.add("status--erro"); }
    finally { botao.disabled = false; botao.textContent = "REGISTRAR GASTO"; }
  });
  carregarGastos().catch(erro => { lista.innerHTML = '<p class="status status--erro">' + mensagemErro(erro) + '</p>'; });
})();
</script></body></html>
