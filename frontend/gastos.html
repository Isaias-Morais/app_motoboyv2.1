<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gastos - APP MOTOBOY</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<aside class="sidebar">

    <div class="logo">
        <img src="img/logo-icon.png" alt="Logo">
    </div>

    <nav class="menu">

        <a href="index.html" class="inicio">
            INÍCIO
        </a>

        <a href="registrar.html" class="registrar">
            REGISTRAR
        </a>

        <a href="gastos.html" class="gastos">
            GASTOS
        </a>

        <a href="relatorio.html" class="relatorio">
            RELATÓRIO
        </a>

        <a href="minha-moto.html" class="minha-moto">
            MINHA MOTO
        </a>

    </nav>

    <div class="perfil">

        <img src="img/perfil.jpg" alt="Foto de perfil">

        <div>
            <strong>Perfil</strong>
            <small>Plano</small>
        </div>

    </div>

</aside>


<main>

    <header>

        <div>
            <small>FINANCEIRO</small>
            <h1>Gastos</h1>
        </div>

        <div class="alerta-oleo">
            🛢️
            <span>Troca de óleo em breve</span>
        </div>

    </header>


    <section class="tela-gastos">

        <div class="card-gastos">

            <h2>Registrar gasto</h2>

            <p>
                Registre os gastos da sua moto e acompanhe seus custos.
            </p>


            <form>

                <div class="campo">

                    <label for="tipo">
                        Tipo de gasto
                    </label>

                    <select id="tipo" name="tipo">

                        <option value="">
                            Selecione
                        </option>

                        <option value="combustivel">
                            Combustível
                        </option>

                        <option value="manutencao">
                            Manutenção
                        </option>

                        <option value="alimentacao">
                            Alimentação
                        </option>

                        <option value="outro">
                            Outro
                        </option>

                    </select>

                </div>


                <div class="campo">

                    <label for="valor">
                        Valor
                    </label>

                    <input
                            type="number"
                            id="valor"
                            name="valor"
                            placeholder="R$ 0,00"
                            step="0.01"
                    >

                </div>


                <div class="campo">

                    <label for="data">
                        Data
                    </label>

                    <input
                            type="date"
                            id="data"
                            name="data"
                    >

                </div>


                <div class="campo">

                    <label for="descricao">
                        Descrição
                    </label>

                    <input
                            type="text"
                            id="descricao"
                            name="descricao"
                            placeholder="Ex: Gasolina"
                    >

                </div>


                <button type="submit">
                    REGISTRAR GASTO
                </button>

            </form>

        </div>


        <div class="lista-gastos">

            <h2>Gastos recentes</h2>

            <article class="gasto">

                <div>
                    <strong>Combustível</strong>
                    <small>Hoje</small>
                </div>

                <strong>R$ 35,00</strong>

            </article>


            <article class="gasto">

                <div>
                    <strong>Óleo</strong>
                    <small>Ontem</small>
                </div>

                <strong>R$ 42,00</strong>

            </article>


            <article class="gasto">

                <div>
                    <strong>Manutenção</strong>
                    <small>28/09/2026</small>
                </div>

                <strong>R$ 80,00</strong>

            </article>

        </div>

    </section>

</main>

</body>
</html>
