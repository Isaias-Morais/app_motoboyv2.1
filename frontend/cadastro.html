<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0b0b">
    <meta name="mobile-web-app-capable" content="yes">

    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="img/pwa-icon.svg">
    <link rel="stylesheet" href="css/style.css">

    <title>Cadastro | APP MOTOBOY</title>
</head>

<body class="auth-page">
    <main class="card auth-card">
        <a class="auth-logo" href="login.html" aria-label="APP MOTOBOY">
            <img src="img/logo-icon.png" alt="APP MOTOBOY">
        </a>

        <p class="eyebrow">COMECE AGORA</p>

        <h1 class="auth-title">Crie sua conta</h1>

        <p class="auth-subtitle">
            Preencha seus dados para começar a organizar sua rotina.
        </p>

        <form class="formulario" id="form-cadastro">
            <div class="campo">
                <label for="nome">Nome</label>
                <input
                    id="nome"
                    name="nome"
                    type="text"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="campo">
                <label for="idade">Idade</label>
                <input
                    id="idade"
                    name="idade"
                    type="number"
                    min="18"
                    max="120"
                    autocomplete="bday"
                    required
                >
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input
                    id="senha"
                    name="senha"
                    type="password"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div class="campo">
                <label for="confirmacao-senha">Confirme a senha</label>
                <input
                    id="confirmacao-senha"
                    name="confirmacao-senha"
                    type="password"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >
            </div>

            <button class="button" id="btn-cadastro" type="submit">
                CRIAR CONTA
            </button>
        </form>

        <p
            class="status"
            id="mensagem-cadastro"
            role="status"
            aria-live="polite"
        ></p>

        <p class="auth-footer">
            Já possui uma conta?
            <a href="login.html">Entrar</a>
        </p>
    </main>

    <script src="js/app.js"></script>

    <script src='js/cadastro.js'> </script>

</body>
</html>
```
