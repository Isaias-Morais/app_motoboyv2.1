<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Cadastro | APP MOTOBOY</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page"><main class="card auth-card"><a class="auth-logo" href="login.html" aria-label="APP MOTOBOY"><img src="img/logo-icon.png" alt="APP MOTOBOY"></a><p class="eyebrow">COMECE AGORA</p><h1 class="auth-title">Crie sua conta</h1><p class="auth-subtitle">Preencha seus dados para começar a organizar sua rotina.</p><form class="formulario" id="form-cadastro"><div class="campo"><label for="nome">Nome</label><input id="nome" name="nome" type="text" autocomplete="name" required></div><div class="campo"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="campo"><label for="idade">Idade</label><input id="idade" name="idade" type="number" min="18" max="120" autocomplete="bday" required></div><div class="campo"><label for="senha">Senha</label><input id="senha" name="senha" type="password" minlength="6" autocomplete="new-password" required></div><div class="campo"><label for="confirmacao-senha">Confirme a senha</label><input id="confirmacao-senha" name="confirmacao-senha" type="password" minlength="6" autocomplete="new-password" required></div><button class="button" id="btn-cadastro" type="submit">CRIAR CONTA</button></form><p class="status" id="mensagem-cadastro" role="status" aria-live="polite"></p><p class="auth-footer">Já possui uma conta? <a href="login.html">Entrar</a></p></main><script src="js/app.js"></script><script>
(() => {
  const { baseUrl, mensagemErro } = window.MotoboyApi;
  const form = document.getElementById("form-cadastro"), botao = document.getElementById("btn-cadastro"), mensagem = document.getElementById("mensagem-cadastro");
  form.addEventListener("submit", async evento => {
    evento.preventDefault();
    const senha = document.getElementById("senha").value, confirmacao = document.getElementById("confirmacao-senha").value;
    if (senha !== confirmacao) { mensagem.textContent = "As senhas não coincidem."; mensagem.classList.add("status--erro"); return; }
    botao.disabled = true; botao.textContent = "CRIANDO..."; mensagem.textContent = ""; mensagem.classList.remove("status--erro");
    try {
      const resposta = await fetch(baseUrl + "/Motoboy/create", { method:"POST", headers:{ Accept:"application/json", "Content-Type":"application/json" }, body:JSON.stringify({ nome:document.getElementById("nome").value.trim(), email:document.getElementById("email").value.trim(), idade:Number(document.getElementById("idade").value), senha }) });
      const resultado = await resposta.json().catch(() => ({}));
      if (!resposta.ok) throw new Error(typeof resultado.detail === "string" ? resultado.detail : "Não foi possível concluir o cadastro.");
      mensagem.textContent = "Conta criada com sucesso. Redirecionando para o login...";
      setTimeout(() => window.location.assign("login.html"), 1200);
    } catch (erro) { mensagem.textContent = mensagemErro(erro); mensagem.classList.add("status--erro"); botao.disabled = false; botao.textContent = "CRIAR CONTA"; }
  });
})();
</script></body></html>
