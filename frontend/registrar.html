<section class="card" style="max-width:800px"><h2>Como foi o seu dia?</h2><p>Registre os dados do trabalho para manter o painel e os relatórios atualizados.</p><form class="formulario"><div class="campo"><label for="data">Data</label><input id="data" name="data" type="date" required></div><div class="campo"><label for="ganhos">Ganhos do dia</label><input id="ganhos" name="ganhos" type="number" min="0" step="0.01" placeholder="R$ 0,00" required></div><div class="campo"><label for="km">Quilômetros rodados</label><input id="km" name="km" type="number" min="0" step="0.1" placeholder="0 km" required></div><button class="button" type="submit">SALVAR REGISTRO</button></form></section></main></body></html>
