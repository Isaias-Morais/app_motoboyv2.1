<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#0b0b0b"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="img/pwa-icon.svg"><title>Registrar | APP MOTOBOY</title><link rel="stylesheet" href="css/style.css"></head><body><aside class="sidebar"><a class="logo" href="index.html" aria-label="APP MOTOBOY - início"><img src="img/logo-icon.png" alt="APP MOTOBOY"></a><nav class="menu" aria-label="Navegação principal"><a href="index.html">INÍCIO</a><a href="registrar.html" aria-current="page">REGISTRAR</a><a href="gastos.html">GASTOS</a><a href="relatorio.html">RELATÓRIO</a><a href="minha-moto.html">MINHA MOTO</a></nav><div class="perfil"><span class="avatar" aria-hidden="true">IM</span><div class="perfil-info"><strong>Perfil</strong><small>Plano atual</small></div></div></aside><main><header class="page-header"><div><p class="eyebrow">ROTINA</p><h1>Registrar trabalho</h1></div><div class="alerta-oleo">🛢️ <span>Troca de óleo em breve</span></div></header><section class="card" style="max-width:800px"><h2>Como foi o seu dia?</h2><p>Registre os dados do trabalho para manter o painel e os relatórios atualizados.</p><form class="formulario" id="form-registro"><div class="campo"><label for="data">Data</label><input id="data" name="data" type="date" required></div><div class="campo"><label for="ganhos">Ganhos do dia</label><input id="ganhos" name="ganhos" type="number" min="0" step="0.01" placeholder="R$ 0,00" required></div><div class="campo"><label for="km-inicial">Quilometragem inicial</label><input id="km-inicial" name="km-inicial" type="number" min="0" step="1" placeholder="0 km" required></div><div class="campo"><label for="km-final">Quilometragem final</label><input id="km-final" name="km-final" type="number" min="0" step="1" placeholder="0 km" required></div><button class="button" type="submit" id="btn-registro">SALVAR REGISTRO</button></form><p class="status" id="mensagem-registro" role="status" aria-live="polite"></p></section></main><script src="js/app.js"></script><script src="js/registro.js"></script></body></html>
