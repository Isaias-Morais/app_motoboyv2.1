<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Registrar | APP MOTOBOY</title><link rel="stylesheet" href="css/style.css"></head>
<body><aside class="sidebar"><a class="logo" href="index.html" aria-label="APP MOTOBOY - início"><img src="img/logo-icon.png" alt="APP MOTOBOY"></a><nav class="menu" aria-label="Navegação principal"><a href="index.html">INÍCIO</a><a href="registrar.html" aria-current="page">REGISTRAR</a><a href="gastos.html">GASTOS</a><a href="relatorio.html">RELATÓRIO</a><a href="minha-moto.html">MINHA MOTO</a></nav><div class="perfil"><span class="avatar" aria-hidden="true">IM</span><div class="perfil-info"><strong>Perfil</strong><small>Plano atual</small></div></div></aside>
<main><header class="page-header"><div><p class="eyebrow">ROTINA</p><h1>Registrar trabalho</h1></div><div class="alerta-oleo">🛢️ <span>Troca de óleo em breve</span></div></header>
<section class="card" style="max-width:800px"><h2>Como foi o seu dia?</h2><p>Registre os dados do trabalho para manter o painel e os relatórios atualizados.</p><form class="formulario" id="form-registro"><div class="campo"><label for="data">Data</label><input id="data" name="data" type="date" required></div><div class="campo"><label for="ganhos">Ganhos do dia</label><input id="ganhos" name="ganhos" type="number" min="0" step="0.01" placeholder="R$ 0,00" required></div><div class="campo"><label for="km-inicial">Quilometragem inicial</label><input id="km-inicial" name="km-inicial" type="number" min="0" step="1" placeholder="0 km" required></div><div class="campo"><label for="km-final">Quilometragem final</label><input id="km-final" name="km-final" type="number" min="0" step="1" placeholder="0 km" required></div><button class="button" type="submit" id="btn-registro">SALVAR REGISTRO</button></form><p class="status" id="mensagem-registro" role="status" aria-live="polite"></p></section></main><script src="js/app.js"></script><script>
(() => {
  const { requisicao, mensagemErro } = window.MotoboyApi;
  const form = document.getElementById("form-registro"), botao = document.getElementById("btn-registro"), mensagem = document.getElementById("mensagem-registro");
  document.getElementById("data").value = new Date().toISOString().slice(0, 10);
  form.addEventListener("submit", async evento => {
    evento.preventDefault();
    const inicial = Number(document.getElementById("km-inicial").value), final = Number(document.getElementById("km-final").value);
    if (final <= inicial) { mensagem.textContent = "A quilometragem final deve ser maior que a inicial."; mensagem.classList.add("status--erro"); return; }
    botao.disabled = true; botao.textContent = "SALVANDO..."; mensagem.classList.remove("status--erro"); mensagem.textContent = "";
    try {
      await requisicao("/dia_de_trabalhada/create", { method:"POST", body:JSON.stringify({ data_trabalhada:document.getElementById("data").value, ganho_bruto:Number(document.getElementById("ganhos").value), quilometragem_inicial:inicial, quilometragem_final:final }) });
      mensagem.textContent = "Dia de trabalho registrado com sucesso."; form.reset(); document.getElementById("data").value = new Date().toISOString().slice(0, 10);
    } catch (erro) { mensagem.textContent = mensagemErro(erro); mensagem.classList.add("status--erro"); }
    finally { botao.disabled = false; botao.textContent = "SALVAR REGISTRO"; }
  });
})();
</script></body></html>
